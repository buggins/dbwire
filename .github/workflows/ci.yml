name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SUBPACKAGES: types io tls crypto charset client

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.dc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, dc: dmd-latest }
          - { os: ubuntu-latest, dc: ldc-latest }
          # Minimum supported D frontend: 2.097 (the same as ddbc)
          - { os: ubuntu-latest, dc: dmd-2.097.2 }
          - { os: ubuntu-latest, dc: ldc-1.27.1 }
          - { os: windows-latest, dc: dmd-latest }
          - { os: windows-latest, dc: ldc-latest }
          # DMD does not target arm64 macOS runners
          - { os: macos-latest, dc: ldc-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ${{ matrix.dc }}
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
            ~/AppData/Local/dub/packages
            ~/AppData/Local/dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-${{ matrix.dc }}-
      - name: Build
        run: dub build
      - name: Unit tests (root package)
        run: dub test
      - name: Unit tests (subpackages)
        run: |
          for p in $SUBPACKAGES; do
            echo "::group::dbwire:$p"
            dub test ":$p"
            echo "::endgroup::"
          done
      - name: Fiber-mode tests (vibe-core 2.x)
        timeout-minutes: 10
        run: dub run --root=tests-vibe
      - name: Fiber-mode tests (vibe-core 1.x)
        if: matrix.os == 'ubuntu-latest' && matrix.dc == 'ldc-latest'
        timeout-minutes: 10
        run: dub run --root=tests-vibe1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2.0.0
        with:
          compiler: ldc-latest
      - name: Cache dub packages and builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.dub/packages
            ~/.dub/cache
          key: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-${{ hashFiles('**/dub.json') }}
          restore-keys: dub-${{ github.job }}-${{ runner.os }}-ldc-latest-
      - name: D-Scanner style check
        run: dub run -q dscanner@0.15.2 -- --styleCheck .
      - name: dfmt formatting check
        run: |
          dub run -q dfmt@0.15.2 -- --inplace $(git ls-files '*.d')
          git diff --exit-code
      - name: Documentation builds
        run: |
          dub build -b docs
          for p in $SUBPACKAGES; do dub build ":$p" -b docs; done
